<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinir senha — Sistema 4X CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="login-page">
    <div class="login-box">
      <div class="logo" style="justify-content:center;margin-bottom:8px">
        <span class="logo-icon">◆</span>
        <span class="logo-text">Sistema 4X CRM</span>
      </div>
      <h2 style="text-align:center;font-size:17px;font-weight:600;margin-bottom:20px">Nova senha</h2>

      {% if sucesso %}
      <div class="alert-banner" style="background:#162a1e;border-color:var(--success);color:var(--success);margin-bottom:16px">
        {{ sucesso }}
      </div>
      <a href="{{ url_for('login') }}" class="btn btn-primary" style="width:100%;justify-content:center">
        Ir para o login
      </a>

      {% elif erro and not email %}
      <div class="alert-banner" style="margin-bottom:16px">{{ erro }}</div>
      <a href="{{ url_for('esqueci_senha') }}" class="btn btn-ghost" style="width:100%;justify-content:center">
        Solicitar novo link
      </a>

      {% else %}
      {% if erro %}
      <div class="alert-banner" style="margin-bottom:16px">{{ erro }}</div>
      {% endif %}
      <form method="post">
        <div class="form-group">
          <label>Nova senha</label>
          <input type="password" name="senha" required class="input" placeholder="Mínimo 6 caracteres" autofocus>
        </div>
        <div class="form-group">
          <label>Confirmar nova senha</label>
          <input type="password" name="confirmar" required class="input" placeholder="Repita a senha">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px">
          Salvar nova senha
        </button>
      </form>
      {% endif %}

      <p style="text-align:center;margin-top:16px;font-size:13px">
        <a href="{{ url_for('login') }}" class="link-forgot">← Voltar ao login</a>
      </p>
    </div>
  </div>
</body>
</html>
